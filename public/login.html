<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Log in · EduMemo</title>
<link rel="stylesheet" href="/css/styles.css">
<link rel="manifest" href="/manifest.json">
</head>
<body class="home-page">
<div class="auth-shell">
  <div class="auth-card">
    <div class="auth-brand">
      <img src="/images/logo.png" alt="Institution logo">
      <span data-institution-name>EduMemo</span>
    </div>
    <header class="landing-head">
      <h1>Never miss an important campus memo.</h1>
      <p class="landing-intro">EduMemo delivers verified academic notices, deadlines, and announcements directly to the students and staff they concern.</p>
    </header>

    <div id="alert-region"></div>

    <form id="login-form" autocomplete="off">
      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" required autocomplete="off" readonly>
      </div>
      <div class="field">
        <div class="field-label-row">
          <label for="password">Password</label>
          <a class="field-link" href="/forgot-password.html">Forgot password?</a>
        </div>
        <div class="password-control">
          <input type="password" id="password" name="password" required autocomplete="new-password" readonly>
          <button type="button" class="password-toggle" id="password-toggle" aria-label="Show password" aria-pressed="false">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z"></path><circle cx="12" cy="12" r="3"></circle></svg>
          </button>
        </div>
      </div>
      <button type="submit" class="btn btn-primary btn-block" id="login-btn">Access your account <span aria-hidden="true">→</span></button>
    </form>

    <div class="landing-register">
      <strong>New to EduMemo?</strong>
      <span><a href="/register-student.html">Create a student account</a> or <a href="/register-staff.html">register as staff</a>.</span>
    </div>
  </div>
</div>

<script src="/js/api.js"></script>
<script src="/js/app.js"></script>
<script>
  App.loadInstitutionBranding();

  const form = document.getElementById('login-form');
  const alertRegion = document.getElementById('alert-region');
  const btn = document.getElementById('login-btn');
  const btnLabel = btn.innerHTML;
  const emailInput = document.getElementById('email');
  const passwordInput = document.getElementById('password');
  const passwordToggle = document.getElementById('password-toggle');
  const clearSavedValues = () => {
    form.reset();
    emailInput.value = '';
    passwordInput.value = '';
    emailInput.readOnly = true;
    passwordInput.readOnly = true;
  };
  window.addEventListener('pageshow', () => setTimeout(clearSavedValues, 0));
  [emailInput, passwordInput].forEach(input => input.addEventListener('focus', () => { input.readOnly = false; }, { once: true }));
  passwordToggle.addEventListener('click', () => {
    const visible = passwordInput.type === 'text';
    passwordInput.type = visible ? 'password' : 'text';
    passwordToggle.classList.toggle('is-visible', !visible);
    passwordToggle.setAttribute('aria-label', visible ? 'Show password' : 'Hide password');
    passwordToggle.setAttribute('aria-pressed', String(!visible));
  });

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    alertRegion.innerHTML = '';
    btn.disabled = true;
    btn.innerHTML = '<span class="spinner"></span> Logging in…';
    try {
      const res = await Api.post('/api/auth/login', {
        email: document.getElementById('email').value.trim(),
        password: document.getElementById('password').value,
      });
      window.location.href = res.redirect || '/dashboard';
    } catch (err) {
      alertRegion.innerHTML = `<div class="alert alert-error">${App.escapeHtml(err.message)}</div>`;
      btn.disabled = false;
      btn.innerHTML = btnLabel;
    }
  });
</script>
</body>
</html>
