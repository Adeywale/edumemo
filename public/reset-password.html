<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reset Password · EduMemo</title>
<link rel="stylesheet" href="/css/styles.css">
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#157a3a">
</head>
<body>
<div class="auth-shell">
  <div class="auth-card">
    <div class="auth-brand">
      <img src="/images/logo.png" alt="Institution logo">
      <span data-institution-name>EduMemo</span>
    </div>
    <h1>Reset your password</h1>
    <p class="muted" style="margin-bottom:22px;">Choose a new password below.</p>

    <div id="alert-region"></div>

    <form id="reset-form">
      <div class="field"><label for="password">New password</label><input type="password" id="password" required minlength="8" autocomplete="new-password"></div>
      <div class="field"><label for="confirmPassword">Confirm new password</label><input type="password" id="confirmPassword" required minlength="8" autocomplete="new-password"></div>
      <p class="field-hint" style="margin-bottom:16px;">Use at least 8 characters. This form works from any phone browser.</p>
      <button type="submit" class="btn btn-primary btn-block" id="submit-btn">Reset password</button>
    </form>

    <p class="text-center muted" style="margin-top:20px; font-size:13.5px;">
      <a href="/login.html">Back to log in</a>
    </p>
  </div>
</div>

<script src="/js/api.js"></script>
<script src="/js/app.js"></script>
<script>
  App.loadInstitutionBranding();
  const params = new URLSearchParams(window.location.search);
  const token = params.get('token');
  const form = document.getElementById('reset-form');
  const alertRegion = document.getElementById('alert-region');
  const btn = document.getElementById('submit-btn');

  if (!token) {
    alertRegion.innerHTML = '<div class="alert alert-error">No reset token was provided. Please use the link from your email.</div>';
    form.style.display = 'none';
  }

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    alertRegion.innerHTML = '';
    btn.disabled = true;
    btn.innerHTML = '<span class="spinner"></span> Resetting…';
    try {
      const res = await Api.post('/api/auth/reset-password', {
        token,
        password: document.getElementById('password').value,
        confirmPassword: document.getElementById('confirmPassword').value,
      });
      alertRegion.innerHTML = `<div class="alert alert-success">${App.escapeHtml(res.message)}</div>`;
      form.style.display = 'none';
    } catch (err) {
      alertRegion.innerHTML = `<div class="alert alert-error">${App.escapeHtml(err.message)}</div>`;
      btn.disabled = false;
      btn.textContent = 'Reset password';
    }
  });
</script>
</body>
</html>
