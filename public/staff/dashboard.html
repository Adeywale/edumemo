<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard · EduMemo</title>
<link rel="stylesheet" href="/css/styles.css">
<link rel="manifest" href="/manifest.json">
</head>
<body>
<script src="/js/api.js"></script>
<script src="/js/app.js"></script>
<script src="/js/push.js"></script>
<script>
(async () => {
  const user = await App.requireAuth(['staff']);
  if (!user) return;
  App.loadInstitutionBranding();
  const content = App.renderShell({ role: 'staff', showSearch: false });
  App.initUserChrome(user);

  // Two different staff experiences share this dashboard:
  //  * teaching staff    -> can draft/publish memos to students
  //  * non-teaching staff -> receive-only; no compose/send actions anywhere
  const isTeaching = user.staffType === 'academic';
  const staffLabel = isTeaching ? 'Teaching staff' : 'Non-teaching staff';

  content.innerHTML = `
    <div class="panel-header">
      <div>
        <h1 style="margin:0;">Welcome, ${App.escapeHtml(user.firstName)}</h1>
        <p class="muted" style="margin:4px 0 0; font-size:13px;">${staffLabel}</p>
      </div>
    </div>

    <div class="panel">
      <div class="panel-header"><h2>Quick actions</h2></div>
      <div style="display:flex; gap:12px; flex-wrap:wrap;">
        ${isTeaching
          ? `<a class="btn btn-primary" href="/staff/create-memo.html">✏️ Create Memo</a>
             <a class="btn btn-secondary" href="/staff/memos.html?tab=drafts">View Drafts</a>
             <a class="btn btn-secondary" href="/staff/memos.html?tab=sent">View Sent Memos</a>`
          : '<a class="btn btn-primary" href="/staff/memos.html?tab=received">📥 View Received Memos</a>'}
      </div>
    </div>

    <div class="panel">
      <div class="panel-header"><h2>${isTeaching ? 'Recent activity' : 'Recent memos'}</h2></div>
      <div id="recent-region"><div class="empty-state"><span class="spinner" style="border-top-color:var(--green); border-color:var(--border);"></span></div></div>
    </div>
  `;

  try {
    const { memos } = await Api.get(isTeaching ? '/api/memos?page=1' : '/api/memos?filter=received&page=1');
    const recentRegion = document.getElementById('recent-region');
    if (memos.length === 0) {
      recentRegion.innerHTML = isTeaching
        ? '<div class="empty-state"><div class="emoji">📝</div><h3>No memos sent yet</h3><p>Create your first memo to get started.</p></div>'
        : '<div class="empty-state"><div class="emoji">📥</div><h3>No memos received yet</h3><p>Memos published to you will appear here.</p></div>';
    } else {
      recentRegion.innerHTML = `<div class="list">${memos.slice(0, 6).map(m => `
        <div class="list-row" onclick="window.location.href='/memo.html?id=${m.id}'">
          <div class="row-main">
            <div class="row-title">${App.escapeHtml(m.title)}</div>
            <div class="row-meta">
              ${isTeaching
                ? `<span class="badge ${m.status === 'published' ? 'badge-green' : m.status === 'archived' ? 'badge-grey' : 'badge-amber'}">${m.status}</span>`
                : `${m.sender_name ? `<span>${App.escapeHtml(m.sender_name)}</span>` : ''}${m.is_read ? '' : '<span class="badge badge-amber">New</span>'}`}
              ${m.category_name ? `<span>${App.escapeHtml(m.category_name)}</span>` : ''}
            </div>
          </div>
          <div class="row-side">${App.timeAgo(m.published_at || m.created_at)}</div>
        </div>`).join('')}</div>`;
    }
  } catch (err) { App.showError(err); }
})();
</script>
</body>
</html>
