# Render Blueprint for EduMemo
# Docs: https://render.com/docs/blueprint-spec
#
# Deploy with: Render Dashboard -> New -> Blueprint -> select this repo,
# or via the "Deploy to Render" button once the repo is pushed.
#
# Anything marked `sync: false` is intentionally left blank here — Render
# will prompt for those values in the dashboard during the first deploy.
# NEVER put real credentials (SMTP password, VAPID keys, admin password)
# in this file: it is committed to git.
services:
  - type: web
    name: edumemo
    runtime: node
    plan: free
    buildCommand: npm ci
    startCommand: npm start
    # Unauthenticated JSON endpoint used to verify the service is alive.
    healthCheckPath: /api/config
    autoDeploy: true
    envVars:
      # ---------------- Server ----------------
      - key: NODE_ENV
        value: production
      # Long random secret, generated by Render at first deploy.
      # (Deleting + regenerating this value logs everyone out, nothing else.)
      - key: SESSION_SECRET
        generateValue: true
      # ---------------- Database & uploads (free tier = ephemeral disk) ----
      # NOTE: on the FREE plan there is no persistent disk, so these live in
      # /tmp and are reset whenever the service restarts or redeploys.
      # The startup banner in server.js confirms this state at boot.
      - key: DATABASE_PATH
        value: /tmp/database.sqlite
      - key: UPLOAD_DIR
        value: /tmp/uploads
      - key: AUTO_SEED
        value: 'true'
      # ---------------- Branding ----------------
      - key: INSTITUTION_NAME
        value: Federal Poly Ilaro
      - key: INSTITUTION_SHORT_NAME
        value: FPI
      # ---------------- Email (non-secret defaults) ----------------
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: '587'
      - key: SMTP_SECURE
        value: 'false'
      - key: SMTP_FROM_NAME
        value: EduMemo
      # ---------------- Filled in during first deploy ----------------
      # Public URL of the deployed service, e.g. https://edumemo-xxxx.onrender.com
      # (used inside password-reset / new-memo email links).
      - key: BASE_URL
        sync: false
      # Gmail account + 16-character App Password (no spaces) for sending.
      - key: SMTP_USER
        sync: false
      - key: SMTP_FROM_EMAIL
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      # Web Push keys — generate once with: npx web-push generate-vapid-keys
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: VAPID_SUBJECT
        value: mailto:you@example.com
      # First administrator account, created only when the database is empty.
      - key: SEED_ADMIN_EMAIL
        sync: false
      - key: SEED_ADMIN_PASSWORD
        sync: false
