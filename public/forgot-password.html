<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Forgot Password · EduMemo</title>
<link rel="stylesheet" href="/css/styles.css">
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#157a3a">
</head>
<body>
<div class="auth-shell">
  <div class="auth-card">
    <div class="auth-brand">
      <img src="/images/logo.png" alt="Institution logo">
      <span data-institution-name>EduMemo</span>
    </div>
    <h1>Forgot your password?</h1>
    <p class="muted" style="margin-bottom:22px;">Enter your email and we'll send you a reset link.</p>

    <div id="alert-region"></div>

    <form id="forgot-form">
      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" required autocomplete="email" autofocus>
      </div>
      <p class="field-hint" style="margin-bottom:18px;">The reset link is valid for 1 hour and can be opened on any device, including your phone.</p>
      <button type="submit" class="btn btn-primary btn-block" id="submit-btn">Send reset link</button>
    </form>

    <p class="text-center muted" style="margin-top:20px; font-size:13.5px;">
      <a href="/login.html">Back to log in</a>
    </p>
  </div>
</div>

<script src="/js/api.js"></script>
<script src="/js/app.js"></script>
<script>
  App.loadInstitutionBranding();
  const form = document.getElementById('forgot-form');
  const alertRegion = document.getElementById('alert-region');
  const btn = document.getElementById('submit-btn');

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    alertRegion.innerHTML = '';
    btn.disabled = true;
    btn.innerHTML = '<span class="spinner"></span> Sending…';
    try {
      const res = await Api.post('/api/auth/forgot-password', { email: document.getElementById('email').value.trim() });
      let msg = res.message;
      if (res.devResetUrl) msg += ` <br><br><strong>Dev mode:</strong> <a href="${res.devResetUrl}">Reset your password</a>.`;
      alertRegion.innerHTML = `<div class="alert alert-success">${msg}</div>`;
      btn.textContent = 'Link sent';
    } catch (err) {
      alertRegion.innerHTML = `<div class="alert alert-error">${App.escapeHtml(err.message)}</div>`;
      btn.disabled = false;
      btn.textContent = 'Send reset link';
    }
  });
</script>
</body>
</html>
