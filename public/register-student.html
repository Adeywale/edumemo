<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Student Registration · EduMemo</title>
<link rel="stylesheet" href="/css/styles.css">
<link rel="manifest" href="/manifest.json">
</head>
<body class="student-registration">
<div class="auth-shell">
  <div class="auth-card wide">
    <div class="auth-brand">
      <img src="/images/logo.png" alt="EduMemo">
    </div>
    <p class="registration-eyebrow">STUDENT PORTAL</p>
    <h1>Student registration</h1>
    <p class="registration-intro">Create your secure account and stay informed with official campus memos.</p>

    <div id="alert-region"></div>

    <form id="reg-form" autocomplete="off" novalidate>
      <h3>Personal Information</h3>
      <div class="form-row">
        <div class="field"><label for="firstName">First name *</label><input type="text" id="firstName" required autocomplete="given-name" pattern="[A-Za-zÀ-ÖØ-öø-ÿ' -]+" title="Use letters, spaces, apostrophes, or hyphens only."></div>
        <div class="field"><label for="lastName">Last name *</label><input type="text" id="lastName" required autocomplete="family-name" pattern="[A-Za-zÀ-ÖØ-öø-ÿ' -]+" title="Use letters, spaces, apostrophes, or hyphens only."></div>
      </div>
      <div class="field"><label for="phone">Phone number</label><input type="tel" id="phone" inputmode="numeric" autocomplete="tel" pattern="[0-9]{7,15}" maxlength="15" title="Enter 7 to 15 digits only."></div>

      <h3>Academic Information</h3>
      <div class="form-row">
        <div class="field"><label for="matricNumber">Student ID / Matriculation Number *</label><input type="text" id="matricNumber" name="matriculation-number" required autocomplete="off" spellcheck="false"></div>
        <div class="field"><label for="facultyId">Faculty / School *</label>
          <select id="facultyId" required><option value="">Select faculty</option></select>
        </div>
      </div>
      <div class="form-row">
        <div class="field"><label for="departmentName">Department *</label>
          <div class="department-combobox">
            <input type="text" id="departmentName" required autocomplete="off" aria-autocomplete="list" aria-expanded="false">
            <div id="departmentOptions" class="department-options" role="listbox"></div>
          </div>
        </div>
      </div>
      <div class="form-row">
        <div class="field"><label for="levelId">Level *</label>
          <select id="levelId" required><option value="">Select level</option></select>
        </div>
        <div class="field"><label for="studyModeId">Study Mode *</label>
          <select id="studyModeId" required><option value="">Select study mode</option></select>
        </div>
      </div>

      <h3>Account</h3>
      <div class="field"><label for="email">Email *</label><input type="email" id="email" required autocomplete="email"></div>
      <div class="form-row">
        <div class="field"><label for="password">Password *</label><input type="password" id="password" required minlength="8" autocomplete="new-password"></div>
        <div class="field"><label for="confirmPassword">Confirm password *</label><input type="password" id="confirmPassword" required minlength="8" autocomplete="new-password"></div>
      </div>
      <p class="field-hint" style="margin-top:-10px;">Minimum 8 characters.</p>

      <h3>Notification Setup</h3>
      <div class="checkbox-row" style="margin-bottom: 22px;">
        <input type="checkbox" id="enablePush">
        <label for="enablePush">I want web push notifications on my phone (you'll finish enabling this device after your first sign-in, from Settings)</label>
        <button type="button" id="bell-demo" class="bell-btn" style="margin-left:auto;" aria-label="Preview notification bell">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
        </button>
      </div>

      <button type="submit" class="btn btn-primary btn-block" id="reg-btn">Create my account <span aria-hidden="true">→</span></button>
    </form>

    <p class="registration-login">
      Already have an account? <a href="/login.html">Log in</a>
    </p>
  </div>
</div>

<script src="/js/api.js"></script>
<script src="/js/app.js"></script>
<script src="/js/register-student.js"></script>
</body>
</html>
