<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Staff Registration · EduMemo</title>
<link rel="stylesheet" href="/css/styles.css">
<link rel="manifest" href="/manifest.json">
</head>
<body class="lecturer-registration">
<div class="auth-shell">
  <div class="auth-card wide">
    <div class="auth-brand">
      <img src="/images/logo.png" alt="Institution logo">
      <span data-institution-name>EduMemo</span>
    </div>
    <h1>Staff registration</h1>
    <p class="muted" style="margin-bottom:22px;">Register to create and publish official memos.</p>

    <div id="alert-region"></div>

    <form id="reg-form" autocomplete="off">
      <div class="form-row">
        <div class="field"><label for="firstName">First name *</label><input type="text" id="firstName" required></div>
        <div class="field"><label for="lastName">Last name *</label><input type="text" id="lastName" required></div>
      </div>
      <div class="form-row">
        <div class="field"><label for="email">Email *</label><input type="email" id="email" required autocomplete="off"></div>
        <div class="field"><label for="phone">Phone</label><input type="tel" id="phone"></div>
      </div>
     <fieldset class="field" id="staffType" style="border:0; padding:0; margin:0 0 16px 0;">
  <legend>Staff type </legend>
  <div style="display:flex; gap:8px; flex-wrap:wrap;">
    <label class="checkbox-row" style="margin:0; flex:1; min-width:180px; display:flex; align-items:center; gap:8px; padding:8px 12px;">
      <input type="radio" name="staffType" value="academic" checked><span>Teaching staff</span>
    </label>
    <label class="checkbox-row" style="margin:0; flex:1; min-width:180px; display:flex; align-items:center; gap:8px; padding:8px 12px;">
      <input type="radio" name="staffType" value="non_academic"><span>Non-teaching staff</span>
    </label>
  </div>
</fieldset>
      <div class="form-row" id="academic-details">
        <div class="field"><label for="facultyId">Faculty / School *</label>
          <select id="facultyId" required><option value="">Select faculty</option></select>
        </div>
        <div class="field"><label for="departmentName">Department *</label>
          <div class="department-combobox">
            <input type="text" id="departmentName" required autocomplete="off" aria-autocomplete="list" aria-expanded="false">
            <div id="departmentOptions" class="department-options" role="listbox"></div>
          </div>
        </div>
      </div>
      <div class="form-row">
        <div class="field"><label for="password">Password *</label><input type="password" id="password" required minlength="8" autocomplete="new-password"></div>
        <div class="field"><label for="confirmPassword">Confirm password *</label><input type="password" id="confirmPassword" required minlength="8" autocomplete="new-password"></div>
      </div>

      <h3>Notification Setup</h3>
      <div class="checkbox-row" style="margin-bottom: 22px;">
        <input type="checkbox" id="enablePush">
        <label for="enablePush">I want web push notifications on my phone (you'll finish enabling this device after your first sign-in, from Settings)</label>
        <button type="button" id="bell-demo" class="bell-btn" style="margin-left:auto;" aria-label="Preview notification bell">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
        </button>
      </div>

      <button type="submit" class="btn btn-primary btn-block" id="reg-btn">Create staff account</button>
    </form>

    <p class="text-center muted" style="margin-top:20px; font-size:13.5px;">
      Already have an account? <a href="/login.html">Log in</a>
    </p>
  </div>
</div>

<script src="/js/api.js"></script>
<script src="/js/app.js"></script>
<script src="/js/register-lecturer.js"></script>
<script type="text/plain">
  App.loadInstitutionBranding();

  const facultySel = document.getElementById('facultyId');
  const deptSel = document.getElementById('departmentId');

  Api.get('/api/meta/faculties').then(faculties => {
    facultySel.innerHTML = '<option value="">Select faculty</option>' + faculties.map(f => `<option value="${f.id}">${App.escapeHtml(f.name)}</option>`).join('');
  }).catch(App.showError);

  facultySel.addEventListener('change', async () => {
    deptSel.innerHTML = '<option value="">Loading…</option>';
    if (!facultySel.value) { deptSel.innerHTML = '<option value="">Select faculty first</option>'; return; }
    const depts = await Api.get(`/api/meta/departments?facultyId=${facultySel.value}`);
    deptSel.innerHTML = '<option value="">Select department</option>' + depts.map(d => `<option value="${d.id}">${App.escapeHtml(d.name)}</option>`).join('');
  });

  document.getElementById('enablePush').addEventListener('change', (e) => {
    if (e.target.checked) {
      const bell = document.getElementById('bell-demo');
      bell.classList.remove('swing');
      void bell.offsetWidth;
      bell.classList.add('swing');
    }
  });

  const form = document.getElementById('reg-form');
  const alertRegion = document.getElementById('alert-region');
  const btn = document.getElementById('reg-btn');

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    alertRegion.innerHTML = '';
    btn.disabled = true;
    btn.innerHTML = '<span class="spinner"></span> Creating account…';
    try {
      const res = await Api.post('/api/auth/register/staff', {
        firstName: document.getElementById('firstName').value.trim(),
        lastName: document.getElementById('lastName').value.trim(),
        email: document.getElementById('email').value.trim(),
        phone: document.getElementById('phone').value.trim(),
        facultyId: facultySel.value, departmentId: deptSel.value,
        password: document.getElementById('password').value,
        confirmPassword: document.getElementById('confirmPassword').value,
        enablePush: document.getElementById('enablePush').checked,
      });
      const msg = res.message;
      alertRegion.innerHTML = `<div class="alert alert-success">${msg}</div>`;
      form.reset();
      btn.textContent = 'Account created';
    } catch (err) {
      alertRegion.innerHTML = `<div class="alert alert-error">${App.escapeHtml(err.message)}</div>`;
      btn.disabled = false;
      btn.textContent = 'Create staff account';
    }
  });
</script>
</body>
</html>
