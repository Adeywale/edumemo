<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Settings · EduMemo</title>
<link rel="stylesheet" href="/css/styles.css">
</head>
<body>
<script src="/js/api.js"></script>
<script src="/js/app.js"></script>
<script src="/js/push.js"></script>
<script>
(async () => {
  const user = await App.requireAuth(['staff']);
  if (!user) return;
  App.loadInstitutionBranding();
  const content = App.renderShell({ role: 'staff', showSearch: false });
  App.initUserChrome(user);

  content.innerHTML = `
    <div class="panel-header"><h1>Settings</h1></div>

    <div class="panel">
      <div class="panel-header"><h2>Profile</h2></div>
      <form id="profile-form">
        <div class="form-row">
          <div class="field"><label for="firstName">First name</label><input type="text" id="firstName" required></div>
          <div class="field"><label for="lastName">Last name</label><input type="text" id="lastName" required></div>
        </div>
        <div class="form-row">
          <div class="field"><label for="otherName">Other name</label><input type="text" id="otherName"></div>
          <div class="field"><label for="phone">Phone</label><input type="tel" id="phone"></div>
        </div>
        <div class="field"><label>Email</label><input type="text" id="emailReadonly" disabled></div>
        <div id="academic-readonly" class="field-hint" style="margin-bottom:16px;"></div>
        <button type="submit" class="btn btn-primary">Save profile</button>
      </form>
    </div>

    <div class="panel">
      <div class="panel-header"><h2>Notification Preferences</h2></div>
      <p class="field-hint" style="margin-bottom:14px;">📧 Memo emails are sent to your inbox immediately whenever a memo is published to you — no setting required.</p>
      <div class="checkbox-row" style="margin-bottom:16px;">
        <input type="checkbox" id="pushNotif">
        <label for="pushNotif">Web push notifications</label>
        <button type="button" id="bell-demo" class="bell-btn" style="margin-left:auto;" aria-hidden="true" tabindex="-1">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
        </button>
      </div>
      <p class="field-hint" id="push-status"></p>
      <p class="field-hint" style="margin-bottom:4px;">💡 For alerts even when EduMemo is closed, install the app on an Android phone (Chrome ▸ <strong>Add to Home screen</strong>). iPhone/iPad browsers can't receive web push — memo emails are still delivered to your inbox.</p>
      <button class="btn btn-secondary" id="save-prefs-btn">Save preferences</button>
    </div>

    <div class="panel">
      <div class="panel-header"><h2>Change Password</h2></div>
      <form id="password-form">
        <div class="field"><label for="currentPassword">Current password</label><input type="password" id="currentPassword" required></div>
        <div class="form-row">
          <div class="field"><label for="newPassword">New password</label><input type="password" id="newPassword" required minlength="8"></div>
          <div class="field"><label for="confirmPassword">Confirm new password</label><input type="password" id="confirmPassword" required minlength="8"></div>
        </div>
        <button type="submit" class="btn btn-secondary">Change password</button>
      </form>
    </div>
  `;

  async function loadProfile() {
    const { account, profile } = await Api.get('/api/profile');
    document.getElementById('firstName').value = account.firstName;
    document.getElementById('lastName').value = account.lastName;
    document.getElementById('otherName').value = account.otherName || '';
    document.getElementById('phone').value = account.phone || '';
    document.getElementById('emailReadonly').value = account.email;
    document.getElementById('pushNotif').checked = account.pushEnabled;
    const statusEl = document.getElementById('push-status');
    if (!account.pushConfigured) statusEl.textContent = 'Web push is not configured by the administrator yet — memo emails still arrive in your inbox.';
    else if (account.pushSubscribed) statusEl.textContent = 'Web push is enabled. This device will alert you when a memo is published, even if EduMemo is closed.';
    else if (account.pushEnabled) statusEl.textContent = 'Enabled for your account, but not on this device yet. Tick the box above and allow the permission prompt to enable it here.';
    else statusEl.textContent = 'Web push is disabled. Memo emails are still sent to your inbox immediately.';
    if (profile) {
      document.getElementById('academic-readonly').textContent =
        `${profile.staff_number || ''} · ${profile.faculty_name || ''} · ${profile.department_name || ''}`;
    }
  }
  loadProfile().catch(App.showError);

  document.getElementById('profile-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    try {
      await Api.put('/api/profile', {
        firstName: document.getElementById('firstName').value.trim(),
        lastName: document.getElementById('lastName').value.trim(),
        otherName: document.getElementById('otherName').value.trim(),
        phone: document.getElementById('phone').value.trim(),
      });
      App.toast('Profile updated.', 'success');
    } catch (err) { App.showError(err); }
  });

  document.getElementById('pushNotif').addEventListener('change', async (e) => {
    const statusEl = document.getElementById('push-status');
    const bell = document.getElementById('bell-demo');
    if (e.target.checked) {
      statusEl.textContent = 'Requesting permission…';
      const result = await PushClient.enable(() => {
        bell.classList.remove('swing'); void bell.offsetWidth; bell.classList.add('swing');
      });
      if (!result.ok) {
        e.target.checked = false;
        statusEl.textContent = result.reason;
      } else {
        statusEl.textContent = 'Web push is enabled on this device ✓ New-memo alerts arrive even when EduMemo is closed.';
      }
    } else {
      await PushClient.disable();
      statusEl.textContent = 'Web push is disabled on this device. Memo emails still arrive in your inbox.';
    }
  });

  document.getElementById('save-prefs-btn').addEventListener('click', async () => {
    try {
      await Api.put('/api/profile/notification-preferences', {
        pushEnabled: document.getElementById('pushNotif').checked,
      });
      App.toast('Notification preferences saved.', 'success');
    } catch (err) { App.showError(err); }
  });

  document.getElementById('password-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const newPassword = document.getElementById('newPassword').value;
    const confirmPassword = document.getElementById('confirmPassword').value;
    if (newPassword !== confirmPassword) return App.toast('New passwords do not match.', 'error');
    try {
      await Api.post('/api/profile/change-password', {
        currentPassword: document.getElementById('currentPassword').value,
        newPassword, confirmPassword,
      });
      App.toast('Password changed successfully.', 'success');
      document.getElementById('password-form').reset();
    } catch (err) { App.showError(err); }
  });
})();
</script>
</body>
</html>
