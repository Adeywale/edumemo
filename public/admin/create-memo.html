<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Create Memo · EduMemo Admin</title>
<link rel="stylesheet" href="/css/styles.css">
</head>
<body>
<script src="/js/api.js"></script>
<script src="/js/app.js"></script>
<script>
(async () => {
  const user = await App.requireAuth(['administrator']);
  if (!user) return;
  App.loadInstitutionBranding();
  const content = App.renderShell({ role: 'administrator', showSearch: false });
  App.initUserChrome(user);

  const params = new URLSearchParams(window.location.search);
  const editId = params.get('id');
  const state = { memoId: editId ? Number(editId) : null, existingAttachment: null };

  content.innerHTML = `
    <div class="panel-header"><h1>${editId ? 'Edit Draft' : 'Create Memo'}</h1></div>

    <div class="panel">
      <div class="field"><label for="title">Memo Title *</label><input type="text" id="title" required maxlength="200"></div>
      <div class="form-row">
        <div class="field"><label for="categoryId">Category</label><select id="categoryId"><option value="">No category</option></select></div>
        <div class="field"><label for="attachment">Attachment (PDF, DOC, DOCX, JPG, PNG — max 15MB)</label>
          <input type="file" id="attachment" multiple accept=".pdf,.doc,.docx,.jpg,.jpeg,.png">
          <div class="field-hint" id="attachment-current"></div>
        </div>
      </div>
      <div class="field"><label for="body">Memo Body *</label><textarea id="body" required rows="9"></textarea></div>
    </div>

    <div class="panel">
      <div class="panel-header"><h2>Target Audience</h2></div>
      <div class="field"><label for="recipientGroup">Recipient group</label><select id="recipientGroup"><option value="students">Students</option><option value="academic_staff">Academic / Teaching Staff</option><option value="non_academic_staff">Non-Academic / Non-Teaching Staff</option><option value="all_staff">All Staff</option><option value="selected_users">Selected users</option></select></div>
      <div class="field" id="selected-users-region" style="display:none;"><label for="recipientUserIds">Select users</label><select id="recipientUserIds" multiple size="7"></select></div>
      <div class="checkbox-row" style="margin-bottom:18px;">
        <input type="checkbox" id="institutionWide">
        <label for="institutionWide"><strong>Entire Institution</strong> — broadcast to every active student</label>
      </div>

      <div id="filters-region">
        <div class="form-row three">
          <div class="field"><label for="facultyId">Faculty / School</label><select id="facultyId"><option value=""></option></select></div>
          <div class="field"><label for="departmentId">Department</label><select id="departmentId"><option value=""></option></select></div>
        </div>
        <div class="form-row three">
          <div class="field"><label for="levelId">Level</label><select id="levelId"><option value=""></option></select></div>
          <div class="field"><label for="studyModeId">Study Mode</label><select id="studyModeId"><option value=""></option></select></div>
        </div>
      </div>
      <select id="programmeId" hidden><option value=""></option></select>
      <input type="text" id="courseSearch" hidden autocomplete="off">
      <select id="courseId" hidden><option value=""></option></select>

      <div class="panel" style="background:var(--green-tint); border-color:var(--green-tint-border); margin-bottom:0;">
        <strong id="estimate-text">Estimated recipients: 0</strong>
      </div>
    </div>

    <div style="display:flex; gap:12px; flex-wrap:wrap;">
      <button class="btn btn-secondary" id="save-draft-btn">Save Draft</button>
      <button class="btn btn-secondary" id="preview-btn">Preview</button>
      <button class="btn btn-primary" id="publish-btn">Publish Memo</button>
      ${editId ? '<button class="btn btn-danger" id="delete-draft-btn" style="margin-left:auto;">Delete Draft</button>' : ''}
    </div>
  `;

  const $ = (id) => document.getElementById(id);

  const [categories, faculties, levels, modes, departments] = await Promise.all([
    Api.get('/api/meta/categories'), Api.get('/api/meta/faculties'), Api.get('/api/meta/levels'), Api.get('/api/meta/study-modes'), Api.get('/api/meta/departments'),
  ]);
  $('categoryId').innerHTML += categories.map(c => `<option value="${c.id}">${App.escapeHtml(c.name)}</option>`).join('');
  const studentFaculties = new Map([
    ['SCIT', 'School of Communication and Information Technology (SCIT)'], ['SENG', 'School of Engineering'], ['SENV', 'School of Environmental Studies'], ['SMS', 'School of Management Studies'], ['SPAS', 'School of Pure and Applied Sciences'], ['SPTS', 'School of Part-Time Studies'], ['SAT', 'School of Agricultural Technology'], ['SADP', 'School of Art, Design and Printing'],
  ]);
  $('facultyId').innerHTML += faculties.filter(f => studentFaculties.has(f.code)).map(f => `<option value="${f.id}">${App.escapeHtml(studentFaculties.get(f.code))}</option>`).join('');
  $('departmentId').innerHTML += departments.map(d => `<option value="${d.id}">${App.escapeHtml(d.name)}</option>`).join('');
  $('levelId').innerHTML += levels.map(l => `<option value="${l.id}">${App.escapeHtml(l.name)}</option>`).join('');
  $('studyModeId').innerHTML += modes.map(m => `<option value="${m.id}">${App.escapeHtml(m.name)}</option>`).join('');

  $('institutionWide').addEventListener('change', () => {
    $('filters-region').style.display = $('institutionWide').checked ? 'none' : 'block';
    estimate();
  });
  $('recipientGroup').addEventListener('change', async () => {
    const selected = $('recipientGroup').value === 'selected_users';
    $('selected-users-region').style.display = selected ? 'block' : 'none';
    $('filters-region').style.display = selected || $('institutionWide').checked ? 'none' : 'block';
    if (selected && !$('recipientUserIds').options.length) {
      const users = await Api.get('/api/admin/users');
      $('recipientUserIds').innerHTML = users.filter(u => u.role !== 'administrator').map(u => `<option value="${u.id}">${App.escapeHtml(`${u.first_name} ${u.last_name} — ${u.email}`)}</option>`).join('');
    }
    estimate();
  });

  $('facultyId').addEventListener('change', estimate);
  let courseDebounce;
  $('courseSearch').addEventListener('input', () => {
    clearTimeout(courseDebounce);
    courseDebounce = setTimeout(async () => {
      const q = $('courseSearch').value.trim();
      if (!q) { $('courseId').innerHTML = '<option value=""></option>'; return; }
      const courses = await Api.get(`/api/meta/courses?search=${encodeURIComponent(q)}`);
      $('courseId').innerHTML = '<option value=""></option>' + courses.map(c => `<option value="${c.id}">${App.escapeHtml(c.code)} — ${App.escapeHtml(c.title)}</option>`).join('');
    }, 300);
  });

  ['departmentId', 'levelId', 'studyModeId'].forEach(id => $(id).addEventListener('change', estimate));

  async function estimate() {
    const p = new URLSearchParams();
    p.set('recipientGroup', $('recipientGroup').value);
    if ($('recipientGroup').value === 'selected_users') p.set('recipientUserIds', JSON.stringify([...$('recipientUserIds').selectedOptions].map(option => Number(option.value))));
    if ($('institutionWide').checked) {
      p.set('institutionWide', 'true');
    } else {
      ['facultyId', 'departmentId', 'levelId', 'studyModeId'].forEach(id => { if ($(id).value) p.set(id, $(id).value); });
    }
    try {
      const { count } = await Api.get(`/api/memos/estimate?${p}`);
      $('estimate-text').textContent = `Estimated recipients: ${count}`;
    } catch (err) { /* ignore */ }
  }

  $('attachment').addEventListener('change', () => {
    if ($('attachment').files.length) $('attachment-current').textContent = `${$('attachment').files.length} file(s) selected`;
  });

  if (editId) {
    try {
      const { memo, attachment, targetRule } = await Api.get(`/api/memos/${editId}`);
      $('title').value = memo.title;
      $('body').value = memo.body;
      if (memo.category_id) $('categoryId').value = memo.category_id;
      if (attachment) { state.existingAttachment = attachment; $('attachment-current').textContent = `Current: ${attachment.original_filename}`; }
      if (memo.is_institution_wide) {
        $('institutionWide').checked = true;
        $('filters-region').style.display = 'none';
      } else if (targetRule) {
        if (targetRule.faculty_id) { $('facultyId').value = targetRule.faculty_id; await $('facultyId').dispatchEvent(new Event('change')); }
        if (targetRule.department_id) { $('departmentId').value = targetRule.department_id; await $('departmentId').dispatchEvent(new Event('change')); }
        if (targetRule.programme_id) $('programmeId').value = targetRule.programme_id;
        if (targetRule.level_id) $('levelId').value = targetRule.level_id;
        if (targetRule.study_mode_id) $('studyModeId').value = targetRule.study_mode_id;
        if (targetRule.course_id) $('courseId').innerHTML += `<option value="${targetRule.course_id}" selected>${App.escapeHtml(targetRule.course_code)} — ${App.escapeHtml(targetRule.course_title)}</option>`;
      }
      estimate();
    } catch (err) { App.showError(err); }
  } else {
    estimate();
  }

  function buildFormData() {
    const fd = new FormData();
    fd.append('title', $('title').value.trim());
    fd.append('body', $('body').value.trim());
    fd.append('categoryId', $('categoryId').value);
    fd.append('institutionWide', $('institutionWide').checked ? 'true' : 'false');
    fd.append('recipientGroup', $('recipientGroup').value);
    fd.append('recipientUserIds', JSON.stringify([...$('recipientUserIds').selectedOptions].map(option => Number(option.value))));
    if (!$('institutionWide').checked) {
      ['facultyId', 'departmentId', 'programmeId', 'levelId', 'studyModeId', 'courseId'].forEach(id => fd.append(id, $(id).value));
    }
    [...$('attachment').files].forEach(file => fd.append('attachments', file));
    return fd;
  }

  function validate() {
    if (!$('title').value.trim() || !$('body').value.trim()) { App.toast('Title and body are required.', 'error'); return false; }
    if ($('recipientGroup').value === 'selected_users' && !$('recipientUserIds').selectedOptions.length) { App.toast('Select at least one user.', 'error'); return false; }
    if (!$('institutionWide').checked && $('recipientGroup').value === 'students') {
      const anyFilter = ['facultyId', 'departmentId', 'programmeId', 'levelId', 'studyModeId', 'courseId'].some(id => $(id).value);
      if (!anyFilter) { App.toast('Select "Entire Institution" or at least one target audience filter.', 'error'); return false; }
    }
    return true;
  }

  async function saveDraft(showToast = true) {
    if (!validate()) return null;
    try {
      const fd = buildFormData();
      if (state.memoId) await Api.putForm(`/api/memos/${state.memoId}`, fd);
      else { const res = await Api.postForm('/api/memos', fd); state.memoId = res.memoId; }
      if (showToast) App.toast('Draft saved.', 'success');
      return state.memoId;
    } catch (err) { App.showError(err); return null; }
  }

  // Guards against double/triple-clicking Save Draft or Publish while a
  // request is still in flight. Without this, a slow request (e.g. a large
  // memo publish) left both buttons clickable, so an impatient second click
  // would fire its own saveDraft() PUT against a memo the first click had
  // already published -- producing "Only draft memos can be edited" even
  // though the memo had, in fact, already sent successfully.
  let isSubmitting = false;
  async function withSubmitGuard(buttons, fn) {
    if (isSubmitting) return;
    isSubmitting = true;
    const originalLabels = buttons.map(btn => btn.textContent);
    buttons.forEach(btn => { btn.disabled = true; });
    try {
      await fn();
    } finally {
      isSubmitting = false;
      buttons.forEach((btn, i) => { btn.disabled = false; btn.textContent = originalLabels[i]; });
    }
  }

  $('save-draft-btn').addEventListener('click', () => {
    const btn = $('save-draft-btn');
    withSubmitGuard([btn, $('publish-btn')], async () => {
      btn.textContent = 'Saving…';
      await saveDraft();
    });
  });

  $('preview-btn').addEventListener('click', () => {
    if (!validate()) return;
    const categoryText = $('categoryId').selectedOptions[0]?.text || '';
    const attachmentName = $('attachment').files[0]?.name || (state.existingAttachment ? state.existingAttachment.original_filename : null);
    const overlay = document.createElement('div');
    overlay.className = 'modal-overlay open';
    overlay.innerHTML = `
      <div class="modal-box" style="max-width:600px; text-align:left;">
        <div class="memo-doc" style="border:none;">
          <div class="memo-doc-header" style="padding:0 0 16px;">
            ${$('institutionWide').checked ? '<span class="badge badge-green">Institution-wide</span> ' : ''}
            ${categoryText && categoryText !== 'No category' ? `<span class="badge badge-grey">${App.escapeHtml(categoryText)}</span>` : ''}
            <h1 style="margin-top:8px;">${App.escapeHtml($('title').value)}</h1>
            <div class="memo-doc-meta">
              <span><strong>From:</strong> ${App.escapeHtml(user.firstName + ' ' + user.lastName)} (Administrator)</span>
              <span><strong>Date:</strong> ${new Date().toLocaleDateString()}</span>
              <span>${App.escapeHtml($('estimate-text').textContent)}</span>
            </div>
          </div>
          <div class="memo-doc-body" style="padding:16px 0;">${App.escapeHtml($('body').value)}</div>
          ${attachmentName ? `<div class="memo-doc-attachment" style="margin:0 0 16px;"><div class="label">Attachment</div><div class="attachment-row"><span class="icon">📄</span>${App.escapeHtml(attachmentName)}</div></div>` : ''}
        </div>
        <div class="modal-actions">
          <button class="btn btn-secondary" data-action="cancel">Back to Edit</button>
          <button class="btn btn-primary" data-action="publish">Publish</button>
        </div>
      </div>`;
    document.body.appendChild(overlay);
    overlay.addEventListener('click', (e) => {
      if (e.target === overlay || e.target.dataset.action === 'cancel') overlay.remove();
      else if (e.target.dataset.action === 'publish') { overlay.remove(); handlePublishClick(); }
    });
  });

  async function handlePublishClick() {
    if (!validate()) return;
    const id = await saveDraft(false);
    if (!id) return;
    try {
      // One-click publish: clicking "Publish Memo" IS the confirmation. The
      // previous extra "SEND TO ENTIRE INSTITUTION?" modal is gone — the admin
      // already opted in by ticking the Entire Institution checkbox, and the
      // server still records the broadcast in the audit log.
      await Api.post(`/api/memos/${id}/publish`, { confirmBroadcast: true });
      App.toast('Memo published successfully — recipients are being notified by email.', 'success');
      setTimeout(() => window.location.href = '/admin/memo-records.html', 900);
    } catch (err) { App.showError(err); }
  }

  $('publish-btn').addEventListener('click', () => {
    const btn = $('publish-btn');
    withSubmitGuard([btn, $('save-draft-btn')], async () => {
      btn.textContent = 'Sending…';
      await handlePublishClick();
    });
  });

  if (editId) {
    $('delete-draft-btn').addEventListener('click', async () => {
      const ok = await App.confirmModal({ title: 'Delete this draft?', body: 'This cannot be undone.', confirmLabel: 'Delete', danger: true });
      if (!ok) return;
      try { await Api.del(`/api/memos/${state.memoId}`); App.toast('Draft deleted.', 'success'); window.location.href = '/admin/memo-records.html'; }
      catch (err) { App.showError(err); }
    });
  }
})();
</script>
</body>
</html>
